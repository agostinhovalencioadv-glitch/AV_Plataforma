<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#110D0C; --dourado:#C7A77F; --dourado-esc:#8A6E4B; --dourado-clr:#E8DAC4;
    --areia:#F7F3EC; --cinza:#6B6259; --linha:#E2DCD1; --verde:#1E7B4F; --vermelho:#A32020;
    --ambar:#B8860B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',Arial,sans-serif;background:var(--areia);color:#1A1A1A;font-size:14px}
  #app{display:flex;min-height:100vh}
  /* ---------- SIDEBAR ---------- */
  aside{width:238px;background:var(--preto);color:var(--dourado-clr);flex-shrink:0;
        display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{padding:26px 20px 18px;border-bottom:1px solid #2A2320}
  .logo .mark{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--dourado);
               letter-spacing:2px;line-height:1}
  .logo .sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;color:var(--dourado-clr);
             letter-spacing:5px;margin-top:4px;opacity:.85}
  nav{padding:14px 10px;overflow-y:auto;flex:1}
  nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
             color:#CFC6B8;font:500 13px 'Inter',Arial;padding:11px 14px;border-radius:8px;
             cursor:pointer;text-align:left;transition:.15s}
  nav button:hover{background:#211A16;color:#fff}
  nav button.on{background:var(--dourado);color:var(--preto);font-weight:600}
  nav .grp{font-size:10px;letter-spacing:1.6px;color:#6E635A;padding:16px 14px 6px;font-weight:600}
  aside .pe{padding:12px 16px;border-top:1px solid #2A2320;font-size:11px;color:#7A6F65}
  aside .pe a{color:var(--dourado);text-decoration:none}
  /* ---------- CONTEÚDO ---------- */
  main{flex:1;min-width:0;padding:22px 28px 60px}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
             border-bottom:1px solid var(--linha);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap}
  header.top h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:600;color:var(--preto)}
  header.top p{color:var(--cinza);font-size:12.5px;margin-top:3px}
  .periodo{display:flex;gap:8px;align-items:center}
  select,input,textarea{font:400 13px 'Inter',Arial;border:1px solid var(--linha);border-radius:7px;
         padding:8px 10px;background:#fff;color:#1A1A1A}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--dourado-clr);border-color:var(--dourado)}
  .btn{background:var(--preto);color:var(--dourado);border:0;border-radius:7px;padding:9px 16px;
       font:600 13px 'Inter',Arial;cursor:pointer}
  .btn:hover{background:#2A211C}
  .btn.gold{background:var(--dourado);color:var(--preto)}
  .btn.ghost{background:#fff;color:var(--preto);border:1px solid var(--linha)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn.del{background:#fff;color:var(--vermelho);border:1px solid #E8CFCF}
  /* ---------- CARDS ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--linha);border-radius:11px;padding:14px 16px;
        border-bottom:3px solid var(--dourado)}
  .card .lb{font-size:10.5px;letter-spacing:.6px;color:var(--cinza);font-weight:600;text-transform:uppercase}
  .card .vl{font-size:22px;font-weight:700;color:var(--preto);margin-top:6px;font-variant-numeric:tabular-nums}
  .card.alerta{border-bottom-color:var(--vermelho)}
  .card.alerta .vl{color:var(--vermelho)}
  h2.sec{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;
         margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--linha);color:var(--preto)}
  /* ---------- TABELAS ---------- */
  .box{background:#fff;border:1px solid var(--linha);border-radius:11px;overflow:hidden}
  .box .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;
            padding:12px 14px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
  .box .bar strong{font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--preto);color:var(--dourado-clr);font-weight:600;font-size:10.5px;
     letter-spacing:.5px;text-transform:uppercase;padding:9px 10px;text-align:left;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #F0ECE4;vertical-align:top}
  tbody tr:hover{background:#FBF8F2}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600}
  .tag.v{background:#F8D7DA;color:#7A1620}.tag.a{background:#FDF3D2;color:#7A5B00}
  .tag.o{background:#D9EFE2;color:#14603C}.tag.n{background:#EDEAE4;color:#5A5148}
  .scroll{overflow-x:auto;max-height:66vh}
  /* ---------- FORM / MODAL ---------- */
  .mask{position:fixed;inset:0;background:rgba(17,13,12,.55);display:flex;align-items:flex-start;
        justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
  .modal{background:#fff;border-radius:13px;width:100%;max-width:720px;overflow:hidden}
  .modal .mh{background:var(--preto);color:var(--dourado);padding:15px 20px;display:flex;
             justify-content:space-between;align-items:center}
  .modal .mh h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600}
  .modal .mb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--linha);display:flex;gap:9px;justify-content:flex-end}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:11px;font-weight:600;color:var(--cinza);text-transform:uppercase;letter-spacing:.4px}
  .fld .req{color:var(--vermelho)}
  .x{background:none;border:0;color:var(--dourado);font-size:22px;cursor:pointer;line-height:1}
  /* ---------- DIVERSOS ---------- */
  .aviso{background:#fff;border:1px solid var(--linha);border-left:3px solid var(--dourado);
         border-radius:9px;padding:12px 14px;font-size:12.5px;color:#40382F}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  .barra{display:flex;align-items:flex-end;gap:5px;height:150px;padding:12px 14px}
  .barra .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
  .barra .b{border-radius:3px 3px 0 0;min-height:1px}
  .barra .b.r{background:var(--dourado)}.barra .b.d{background:var(--preto)}
  .barra .m{font-size:9.5px;color:var(--cinza);text-align:center;padding-top:4px}
  .leg{display:flex;gap:14px;font-size:11px;color:var(--cinza);padding:0 14px 12px}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--preto);color:var(--dourado-clr);
         padding:13px 18px;border-radius:9px;font-size:13px;display:none;z-index:99;max-width:340px;
         border-left:3px solid var(--dourado)}
  .load{padding:40px;text-align:center;color:var(--cinza);font-size:13px}
  .vazio{padding:34px;text-align:center;color:var(--cinza);font-size:13px}
  @media(max-width:820px){
    #app{flex-direction:column} aside{width:100%;height:auto;position:relative}
    nav{display:flex;flex-wrap:wrap;gap:4px} nav .grp{display:none} main{padding:16px}
    .modal .mb{grid-template-columns:1fr}
  }

  .hora{font-size:11px;color:var(--cinza);margin-top:4px}
  .btn.ref{border-color:var(--dourado);color:var(--dourado-esc);background:#fff}
  .btn.ref:hover{background:var(--areia)}
  .secbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cfgwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .cfgwrap .box{margin:0}
  .cap{font-size:11px;color:var(--cinza);padding:8px 14px;border-top:1px solid var(--linha)}
  .params{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:14px}
  .params .fld label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--cinza);margin-bottom:5px}
  .params .fld input,.params .fld select{width:100%}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 14px;
    background:var(--areia);border-bottom:1px solid var(--linha)}
  .filtros select,.filtros input{font-size:12px}
  .fdica{font-size:11px;color:var(--cinza);margin-left:auto;max-width:280px;line-height:1.4}
  .ficha .fh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza);margin-bottom:8px}
  .ficha table th{background:var(--areia);color:var(--dourado-esc);font-size:12px}
  .btn.sm{padding:5px 9px;font-size:11px}
</style>
</head>

function demoObter(k,l){
  const t=DEMO_TAB[k]||{titulos:[],linhas:[],keys:[]};
  const row=(t.linhas.filter(x=>x.row===l)[0])||{cels:[]};
  const o={row:l};
  (DEMO_MAPA[k].campos||[]).forEach(c=>{
    const i=(t.keys||[]).indexOf(c.key);
    let v=i>-1?row.cels[i]:'';
    if(v==='—'||v==null) v='';
    if(c.tipo==='numero') v=String(v).replace(/[R$\s.]/g,'').replace(',','.');
    if(c.tipo==='data'){const m=String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);v=m?m[3]+'-'+m[2]+'-'+m[1]:'';}
    o[c.key]=v;
  });
  return o;
}
function demoDetalhar(k,l){
  const t=DEMO_TAB[k]||{titulos:[],linhas:[],keys:[]};
  const row=(t.linhas.filter(x=>x.row===l)[0])||{cels:[]};
  return {aba:DEMO_MAPA[k].aba,row:l,itens:t.titulos.map((h,i)=>({
    col:'',campo:h,valor:row.cels[i],manual:!!(t.keys||[])[i]
  }))};
}

function toast(msg,erro){

  const t=String(txt||'');

  if(/a vencer|parcial|abaixo|baixa|suspenso/i.test(t)) return '<span class="tag a">'+esc(t)+'</span>';
  if(/pago|recebido|quitado|ativo|dentro|ótima|êxito|andamento/i.test(t)) return '<span class="tag o">'+esc(t)+'</span>';

        mini('Contas a receber em aberto',a.receber.slice(0,8).map(r=>
          [r.cliente,r.vencimento,r.saldo,r.status]),['Cliente','Vencimento','Saldo','Status'])+
        mini('Contas a pagar em aberto',a.pagar.slice(0,8).map(r=>
          [r.fornecedor,r.vencimento,r.valor,r.status]),['Fornecedor','Vencimento','Valor','Status'])+
      '</div>';
  }catch(e){erro(e);}
}
function num(v){const n=parseFloat(String(v).replace(/[^\d,-]/g,'').replace(',','.'));return isNaN(n)?0:Math.max(0,n);}
function mini(titulo,linhas,cabec){
  const corpo=linhas.length?linhas.map(l=>'<tr>'+l.map((c,i)=>
      '<td'+(i===cabec.length-1?'':'')+'>'+(i===cabec.length-1?tag(c):esc(c))+'</td>').join('')+'</tr>').join('')
    :'<tr><td colspan="'+cabec.length+'" class="vazio">Nada pendente.</td></tr>';
  return '<div class="box"><div class="bar"><strong>'+esc(titulo)+'</strong></div>'+
         '<div class="scroll"><table><thead><tr>'+cabec.map(c=>'<th>'+esc(c)+'</th>').join('')+
         '</tr></thead><tbody>'+corpo+'</tbody></table></div></div>';
}

/* ============ GRADES CRUD ============ */
const FILTROS={};   // filtros ativos por aba

function fltAtivos(chave){
  const f=FILTROS[chave]||{}; let n=0;
  for(const k in f) if(String(f[k]||'').trim()) n++;
  return n;
}
function aplicarFiltros(chave){
  const f={};
  document.querySelectorAll('[data-flt]').forEach(i=>{ if(i.value) f[i.dataset.flt]=i.value; });
  FILTROS[chave]=f;
  grade(chave, (el('busca')||{}).value||'');
}
function limparFiltros(chave){ FILTROS[chave]={}; grade(chave,''); }

async function grade(chave,busca){
  el('view').innerHTML='<div class="load">Lendo registros da planilha…</div>';
  try{
    const flt=FILTROS[chave]||{};
    const d=await srv('listar',chave,busca||'',flt);
    CACHE[chave]=d;
    const cfg=L.mapa[chave];
    const nf=fltAtivos(chave);
    el('tSub').textContent=(nf||busca)
      ? d.total+' de '+d.cadastrados+' registro(s) — filtro aplicado na aba '+cfg.aba
      : d.total+' registro(s) na aba '+cfg.aba;

    const filtros=(cfg.filtros||[]).map(f=>{
      const v=flt[f.col]||'';
      if(f.tipo==='texto'){
        return '<input data-flt="'+f.col+'" placeholder="'+esc(f.label)+'" value="'+esc(v)+'" style="min-width:150px">';
      }
      const fonte=f.opcoes||L[f.lista]||[];
      return '<select data-flt="'+f.col+'"><option value="">'+esc(f.label)+': todos</option>'+
        fonte.map(o=>'<option'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    }).join('');

    const corpo=d.linhas.length?d.linhas.map(l=>'<tr>'+l.cels.map(c=>
        (NUMRX.test(String(c).trim())&&String(c).trim()!=='' ? '<td class="num">'+esc(c)+'</td>'
        : /vencido|a vencer|pago|recebido|quitado|parcial|ativo|andamento|prejuízo|margem|acima|dentro|abaixo|divergente|encerrado|suspenso|arquivado/i.test(String(c))
          ? '<td>'+tag(c)+'</td>' : '<td>'+esc(c)+'</td>')).join('')+
      '<td class="num" style="white-space:nowrap">'+
      '<button class="btn ref sm" onclick="ver(\''+chave+'\','+l.row+')">Visualizar</button> '+
      '<button class="btn ghost sm" onclick="editar(\''+chave+'\','+l.row+')">Editar</button> '+
      '<button class="btn del sm" onclick="apagar(\''+chave+'\','+l.row+')">Excluir</button></td></tr>').join('')
      :'<tr><td colspan="'+(d.titulos.length+1)+'" class="vazio">'+
        (nf||busca?'Nenhum registro atende ao filtro. Use “Limpar” para ver todos.':'Nenhum registro. Clique em “Novo registro”.')+
       '</td></tr>';

    el('view').innerHTML=
      '<div class="box"><div class="bar">'+
        '<strong>'+esc(cfg.aba)+'</strong>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<input id="busca" placeholder="Buscar em todas as colunas…" value="'+esc(busca||'')+'" style="min-width:190px">'+
          (chave==='honorarios'?'<button class="btn ghost" onclick="modalParcelas()">Gerar parcelas</button>':'')+
          '<button class="btn ref" data-ref onclick="atualizar()">&#8635; Atualizar</button>'+
          '<button class="btn gold" onclick="editar(\''+chave+'\',0)">+ Novo registro</button>'+
        '</div></div>'+
        (filtros?'<div class="filtros">'+filtros+
          '<button class="btn gold sm" onclick="aplicarFiltros(\''+chave+'\')">Filtrar</button>'+
          '<button class="btn ghost sm" onclick="limparFiltros(\''+chave+'\')">Limpar</button>'+
          '<span class="fdica">O período do topo vale para o Painel, a Agenda e os Relatórios. '+
          'Nesta tela, use estes filtros.</span></div>':'')+
        '<div class="scroll"><table><thead><tr>'+
        d.titulos.map(t=>'<th>'+esc(t)+'</th>').join('')+'<th class="num">Ações</th></tr></thead>'+
        '<tbody>'+corpo+'</tbody></table></div></div>'+
      '<div class="aviso" style="margin-top:14px">Em <b>Visualizar</b> você vê a ficha completa do registro, '+
      'inclusive as colunas calculadas (saldo, status, atraso, rentabilidade). Em <b>Editar</b> aparecem '+
      'somente os campos de preenchimento manual — as fórmulas da planilha cuidam do resto.</div>';

    const b=el('busca');
    if(b) b.onkeydown=e=>{if(e.key==='Enter')aplicarFiltros(chave);};
    document.querySelectorAll('[data-flt]').forEach(i=>{
      if(i.tagName==='SELECT') i.onchange=()=>aplicarFiltros(chave);
      else i.onkeydown=e=>{if(e.key==='Enter')aplicarFiltros(chave);};
    });
  }catch(e){erro(e);}
}

async function editar(chave,linha){
  const cfg=L.mapa[chave];
  let dados={};
  if(linha){ try{ dados=await srv('obter',chave,linha); }catch(e){ return erro(e); } }
  const campos=cfg.campos.map(c=>{
    const v=dados[c.key]==null?'':dados[c.key];
    let inp;
    if(c.tipo==='lista'){
      const ops=(L[c.lista]||[]).map(o=>'<option'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>').join('');
      inp='<select data-k="'+c.key+'"><option value=""></option>'+ops+'</select>';
    }else if(c.tipo==='data'){
      inp='<input type="date" data-k="'+c.key+'" value="'+esc(v)+'">';
    }else if(c.tipo==='numero'){
      inp='<input type="number" step="0.01" data-k="'+c.key+'" value="'+esc(v)+'">';
    }else{
      inp='<input data-k="'+c.key+'" value="'+esc(v)+'">';
    }
    const full=(c.key==='descricao'||c.key==='obs'||c.key==='compromisso')?' full':'';
    return '<div class="fld'+full+'"><label>'+esc(c.label)+(c.obrig?' <span class="req">*</span>':'')+
           '</label>'+inp+'</div>';
  }).join('');
  const m=document.createElement('div');
  m.className='mask';
  m.innerHTML='<div class="modal"><div class="mh"><h3>'+(linha?'Editar registro':'Novo registro')+
    ' · '+esc(cfg.aba)+'</h3><button class="x">&times;</button></div>'+
    '<div class="mb">'+campos+'</div>'+
    '<div class="mf"><button class="btn ghost" id="mCanc">Cancelar</button>'+
    '<button class="btn gold" id="mOk">'+(linha?'Salvar alterações':'Incluir registro')+'</button></div></div>';
  document.body.appendChild(m);
  const fechar=()=>m.remove();
  m.querySelector('.x').onclick=fechar; el('mCanc').onclick=fechar;
  m.onclick=e=>{if(e.target===m)fechar();};
  el('mOk').onclick=async()=>{
    const obj={};
    m.querySelectorAll('[data-k]').forEach(i=>obj[i.dataset.k]=i.value);
    const falta=cfg.campos.filter(c=>c.obrig&&!String(obj[c.key]||'').trim());
    if(falta.length){ toast('Preencha: '+falta.map(f=>f.label).join(', '),true); return; }
    el('mOk').disabled=true; el('mOk').textContent='Salvando…';
    try{
      const r=linha?await srv('atualizar',chave,linha,obj):await srv('incluir',chave,obj);
      fechar(); toast(r.msg); grade(chave);
    }catch(e){ el('mOk').disabled=false; el('mOk').textContent='Tentar novamente'; erro(e); }
  };
}

async function apagar(chave,linha){
  if(!confirm('Excluir este registro da linha '+linha+'?\n\nAs fórmulas da planilha são preservadas.')) return;
  try{ const r=await srv('excluir',chave,linha); toast(r.msg); grade(chave); }catch(e){erro(e);}
}

async function cfgEditar(chave,linha){
  const b=(CACHE.config.blocos||[]).find(x=>x.chave===chave);
  if(!b) return;
  let dados={};
  if(linha){ try{ dados=await srv('cfgObter',chave,linha); }catch(e){ return erro(e); } }
  const campos=b.campos.map(c=>{
    const v=dados[c.key]==null?'':dados[c.key];
    let inp;
    if(c.tipo==='lista'){
      const fonte=c.opcoes||L[c.lista]||[];
      inp='<select data-k="'+c.key+'"><option value=""></option>'+fonte.map(o=>
        '<option'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    }else if(c.tipo==='numero'||c.tipo==='percentual'){
      inp='<input type="number" step="0.01" data-k="'+c.key+'" value="'+esc(v)+'">';
    }else{
      inp='<input data-k="'+c.key+'" value="'+esc(v)+'">';
    }
    return '<div class="fld full"><label>'+esc(c.label)+(c.obrig?' <span class="req">*</span>':'')+'</label>'+inp+'</div>';
  }).join('');
  const m=document.createElement('div'); m.className='mask';
  m.innerHTML='<div class="modal" style="max-width:520px"><div class="mh"><h3>'+
    (linha?'Editar item':'Novo item')+' · '+esc(b.label)+'</h3><button class="x">&times;</button></div>'+
    '<div class="mb">'+campos+'</div>'+
    '<div class="mf"><button class="btn ghost" id="cCanc">Cancelar</button>'+
    '<button class="btn gold" id="cOk">'+(linha?'Salvar':'Incluir')+'</button></div></div>';
  document.body.appendChild(m);
  const fechar=()=>m.remove();
  m.querySelector('.x').onclick=fechar; el('cCanc').onclick=fechar;
  m.onclick=e=>{if(e.target===m)fechar();};
  el('cOk').onclick=async()=>{
    const o={};
    m.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value);
    const falta=b.campos.filter(c=>c.obrig&&!String(o[c.key]||'').trim());
    if(falta.length){ toast('Preencha: '+falta.map(f=>f.label).join(', '),true); return; }
    el('cOk').disabled=true; el('cOk').textContent='Salvando…';
    try{
      const r=linha?await srv('cfgAtualizar',chave,linha,o):await srv('cfgIncluir',chave,o);
      fechar(); L=await srv('getListas'); toast(r.msg); config();
    }catch(e){ el('cOk').disabled=false; el('cOk').textContent='Tentar novamente'; erro(e); }
  };
}

  try{
    const r=await srv('cfgExcluir',chave,linha);

            ['honorarios','Receitas por Tipo de Honorário'],['grupos','Despesas por Grupo'],
            ['atrasos','Contas a Receber por Faixa de Atraso'],
            ['ranking','Ranking de Clientes e Processos'],['equipe','Resultado por Advogado e Centro de Custo']];
async function relatorios(qual){
  const q=qual||'dre';
  el('tSub').textContent='Relatórios do ano de referência, calculados na planilha';
  el('view').innerHTML='<div class="box"><div class="bar"><strong>Relatório</strong>'+
    '<select id="selRel">'+RELS.map(r=>'<option value="'+r[0]+'"'+(r[0]===q?' selected':'')+'>'+r[1]+'</option>').join('')+
    '</select>'+btnRef('Atualizar relatório')+'</div><div class="scroll" id="relBox"><div class="load">Gerando…</div></div></div>';
  el('selRel').onchange=e=>relatorios(e.target.value);
  try{
    const m=await srv('getRelatorio',q);
    const linhas=m.filter(r=>r.join('').trim()!=='');
    el('relBox').innerHTML='<table>'+linhas.map((r,i)=>{
      const t=i===0?'th':'td';
      return '<tr>'+r.map((c,j)=>'<'+t+(j>0?' class="num"':'')+'>'+esc(c)+'</'+t+'>').join('')+'</tr>';
    }).join('')+'</table>';
  }catch(e){erro(e);}
}

function erro(e){
  const msg=(e&&e.message)?e.message:String(e);
  el('view').innerHTML='<div class="aviso" style="border-left-color:#A32020">'+
    '<b>Não foi possível concluir a operação.</b><br>'+esc(msg)+
    '<br><br>Verifique se os nomes das abas da planilha não foram alterados.</div>';
  toast('Erro: '+msg,true);
}

/* ============ INÍCIO ============ */
(async function(){
  montaMenu();
  el('selMes').innerHTML=MESES.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
  const hoje=new Date();
  el('selAno').innerHTML=[-2,-1,0,1,2].map(d=>{const a=hoje.getFullYear()+d;
    return '<option value="'+a+'">'+a+'</option>';}).join('');
  try{
    L=await srv('getListas');
    el('selAno').value=L.ano||hoje.getFullYear();
    el('selMes').value=L.mes||(hoje.getMonth()+1);
    srv('getUrlPlanilha').then(u=>el('linkPlan').href=u).catch(()=>{});
    el('btnPeriodo').onclick=()=>ir(ATUAL);
    el('btnAtualizar').onclick=()=>atualizar();
    el('tHora').textContent='Dados carregados às '+new Date().toLocaleTimeString('pt-BR');
    ir('painel');
  }catch(e){erro(e);}
})();
</script>
